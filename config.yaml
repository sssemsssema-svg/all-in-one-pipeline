version: "1.0"
routing:
  stages: [creative, architect, coder]
  tag_to_stage:
    creative: creative
    architect: architect
    coder: coder
    brainstorm: creative
    design: architect
    implement: coder
    code: coder
providers:
  creative:
    - name: groq_gpt_120b
      model: openai/gpt-oss-120b
      endpoint: https://api.groq.com/openai/v1/chat/completions
      api_style: openai
      rpm: 30
      tpd: 1000000
      api_key_env: GROQ_API_KEY
      tags: [creative, fast, premium]
