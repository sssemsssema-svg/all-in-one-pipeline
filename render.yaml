services:
  - type: web
    name: all-in-one-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
